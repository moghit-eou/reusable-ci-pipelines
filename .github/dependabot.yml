# Dependabot owns the SHA-pinned GitHub Actions in .github/workflows.
# Everything else (tool pins in ci/setup-tools.sh, pre-commit revs,
# python-version) is owned by Renovate, see renovate.json.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait 7 days after a release before proposing it.
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: "chore(actions)"
